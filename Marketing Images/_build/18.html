<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800;900&display=swap" />
<link rel="stylesheet" href="shared.css" />
<style>
  body { background: var(--primary); color: var(--primary-foreground); position:relative; }
  .center-wrap { height: 1000px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding: 0 70px; }
  .logo-badge { width: 74px; height:74px; }
  .eyebrow { margin-top: 30px; font-family:"Poppins",sans-serif; font-weight:700; font-size:20px; letter-spacing:0.26em; text-transform:uppercase; opacity:0.85; }
  h1 { font-family:"Poppins","Noto Sans Bengali",sans-serif; font-weight:900; font-size: 66px; line-height:1.2; margin-top: 20px; }

  .pills { display:flex; flex-wrap:wrap; gap: 14px; justify-content:center; margin-top: 44px; }
  .pill { background: oklch(1 0 0/0.15); border: 1.5px solid oklch(1 0 0/0.35); font-family:"Poppins",sans-serif; font-weight:700; font-size: 19px; padding: 14px 26px; border-radius: 999px; }

  .footer { position:absolute; bottom:0; left:0; right:0; background: oklch(0.22 0.02 150/0.9); padding: 26px 60px; display:flex; align-items:center; justify-content:space-between; font-family:"Poppins",sans-serif; font-weight:800; font-size:23px; }
</style>
</head>
<body>
  <div class="center-wrap">
    <img class="logo-badge" src="../_source/logo.png" />
    <div class="eyebrow">Career Support</div>
    <h1>চাকরি খোঁজার পথে<br/>আপনি একা নন</h1>
    <div class="pills">
      <span class="pill">ক্যারিয়ার কাউন্সেলিং</span>
      <span class="pill">সিভি সহায়তা</span>
      <span class="pill">ইন্টারভিউ প্রস্তুতি</span>
      <span class="pill">অ্যালামনাই নেটওয়ার্ক</span>
    </div>
  </div>
  <div class="footer"><span>NNMI — Nightingale Nursing &amp; Midwifery Institute</span><span>01715-038551</span></div>
</body>
</html>
