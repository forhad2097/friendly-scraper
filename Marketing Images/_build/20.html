<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800;900&display=swap" />
<link rel="stylesheet" href="shared.css" />
<style>
  body { background: var(--leaf); position:relative; }
  .top { padding: 56px 60px 0; display:flex; align-items:center; justify-content:space-between; }
  .eyebrow { font-family:"Poppins",sans-serif; font-weight:700; font-size:20px; letter-spacing:0.22em; text-transform:uppercase; color: var(--forest); }
  h1 { font-family:"Poppins","Noto Sans Bengali",sans-serif; font-weight:900; font-size:52px; margin-top:10px; color: var(--leaf-foreground); }
  .logo-badge { width: 76px; height:76px; }

  .grid-wrap { height: 860px; display:flex; flex-direction:column; justify-content:center; }
  .grid { padding: 0 56px; display:grid; grid-template-columns: repeat(3,1fr); gap: 26px; }
  .box { background: var(--card); border-radius: 24px; padding: 44px 26px; text-align:center; }
  .box .ic { width:86px; height:86px; border-radius:50%; background: var(--accent); display:flex; align-items:center; justify-content:center; font-size:40px; margin: 0 auto; }
  .box h3 { font-family:"Poppins","Noto Sans Bengali",sans-serif; font-weight:800; font-size: 24px; margin-top: 22px; line-height:1.3; color: var(--forest); }
  .box p { font-size:16px; color:var(--muted-foreground); font-weight:500; margin-top:8px; line-height:1.4; }

  .footer { position:absolute; bottom:0; left:0; right:0; background: var(--forest); color: var(--forest-foreground); padding: 26px 60px; display:flex; align-items:center; justify-content:space-between; font-family:"Poppins",sans-serif; font-weight:800; font-size:23px; }
</style>
</head>
<body>
  <div class="top">
    <div>
      <div class="eyebrow">Caregiver Skills</div>
      <h1>যা যা শিখবেন</h1>
    </div>
    <img class="logo-badge" src="../_source/logo.png" />
  </div>

  <div class="grid-wrap">
    <div class="grid">
      <div class="box"><div class="ic">👵</div><h3>প্রবীণ পরিচর্যা</h3><p>Elderly care</p></div>
      <div class="box"><div class="ic">🤝</div><h3>রোগীকে সহায়তা</h3><p>Patient assistance</p></div>
      <div class="box"><div class="ic">🛏️</div><h3>বেডসাইড কেয়ার</h3><p>Bedside care</p></div>
      <div class="box"><div class="ic">🚶</div><h3>চলাচলে সহায়তা</h3><p>Mobility support</p></div>
      <div class="box"><div class="ic">🧼</div><h3>হাইজিন সাপোর্ট</h3><p>Hygiene support</p></div>
      <div class="box"><div class="ic">💬</div><h3>পেশাদার যোগাযোগ</h3><p>Professional communication</p></div>
    </div>
  </div>

  <div class="footer"><span>NNMI — Caregiver Training</span><span>01715-038551</span></div>
</body>
</html>
