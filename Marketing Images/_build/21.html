<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800;900&display=swap" />
<link rel="stylesheet" href="shared.css" />
<style>
  body { background: var(--forest); color: var(--forest-foreground); position:relative; }
  .center-wrap { height: 950px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .logo-badge { width: 84px; height:84px; }
  .eyebrow { margin-top: 26px; font-family:"Poppins",sans-serif; font-weight:700; font-size:20px; letter-spacing:0.26em; text-transform:uppercase; color: var(--leaf); }
  h1 { font-family:"Poppins","Noto Sans Bengali",sans-serif; font-weight:900; font-size:52px; margin-top:12px; }

  .people { display:flex; gap: 40px; margin-top: 56px; }
  .card { width: 360px; background: oklch(0.97 0.02 145/0.06); border: 1.5px solid oklch(0.97 0.02 145/0.22); border-radius: 28px; padding: 40px 30px; text-align:center; }
  .mono { width: 130px; height:130px; border-radius:50%; margin: 0 auto; background: var(--leaf); color: var(--leaf-foreground);
    display:flex; align-items:center; justify-content:center; font-family:"Poppins",sans-serif; font-weight:900; font-size:44px; }
  .card h2 { font-family:"Poppins","Noto Sans Bengali",sans-serif; font-weight:800; font-size: 25px; margin-top: 22px; line-height:1.3; }
  .card p { font-family:"Poppins",sans-serif; font-weight:600; font-size: 18px; margin-top:8px; color: var(--leaf); letter-spacing:0.04em; text-transform:uppercase; }

  .tagline { margin-top: 50px; font-family:"Noto Sans Bengali",sans-serif; font-weight:600; font-size: 20px; opacity:0.8; font-style: italic; }

  .footer { position:absolute; bottom:0; left:0; right:0; background: var(--primary); color: var(--primary-foreground); padding: 26px 60px; display:flex; align-items:center; justify-content:space-between; font-family:"Poppins",sans-serif; font-weight:800; font-size:23px; }
</style>
</head>
<body>
  <div class="center-wrap">
    <img class="logo-badge" src="../_source/logo.png" />
    <div class="eyebrow">Leadership</div>
    <h1>আমাদের নেতৃত্ব</h1>

    <div class="people">
      <div class="card">
        <div class="mono">MGS</div>
        <h2>Mohammad Golam Sarwar</h2>
        <p>Chairman</p>
      </div>
      <div class="card">
        <div class="mono">MH</div>
        <h2>Prof. Dr. Moazzem Hossain</h2>
        <p>Managing Director</p>
      </div>
    </div>

    <div class="tagline">"Enter to Learn, Leave to Serve"</div>
  </div>
  <div class="footer"><span>NNMI — Nightingale Nursing &amp; Midwifery Institute</span><span>01715-038551</span></div>
</body>
</html>
