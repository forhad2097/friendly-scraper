<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800;900&display=swap" />
<link rel="stylesheet" href="shared.css" />
<style>
  body { background: var(--primary); color: var(--primary-foreground); position: relative; }
  .center-wrap { height: 1000px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .avatar { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; border: 5px solid oklch(1 0 0/0.85); box-shadow: 0 14px 30px rgba(0,0,0,0.25); }
  .eyebrow { margin-top: 30px; font-family:"Poppins",sans-serif; font-weight:700; font-size:21px; letter-spacing:0.26em; text-transform:uppercase; opacity: 0.9; }

  .bignum { font-family:"Poppins",sans-serif; font-weight:900; font-size: 240px; line-height:0.9; margin-top: 18px; }
  .capline { font-family:"Poppins","Noto Sans Bengali",sans-serif; font-weight:800; font-size: 34px; margin-top: 8px; }

  .breakdown { display:flex; gap: 18px; margin-top: 40px; }
  .bd { background: oklch(1 0 0/0.14); border: 1.5px solid oklch(1 0 0/0.35); border-radius: 18px; padding: 18px 28px; }
  .bd b { display:block; font-family:"Poppins",sans-serif; font-weight:900; font-size:30px; }
  .bd span { font-size: 16px; opacity: 0.9; }

  .footer { position:absolute; bottom:0; left:0; right:0; background: oklch(0.22 0.02 150/0.92); padding: 26px 60px; display:flex; align-items:center; justify-content:space-between; font-family:"Poppins",sans-serif; font-weight:800; font-size:24px; }
</style>
</head>
<body>
  <div class="center-wrap">
    <img class="avatar" src="../_source/logo.png" />
    <div class="eyebrow">Admission Open · Limited Seats</div>
    <div class="bignum">85</div>
    <div class="capline">মোট আসন — শুধু বার্ষিক এই সংখ্যক শিক্ষার্থী ভর্তি হন</div>
    <div class="breakdown">
      <div class="bd"><b>45</b><span>Nursing Science &amp; Midwifery</span></div>
      <div class="bd"><b>40</b><span>Midwifery</span></div>
    </div>
  </div>
  <div class="footer"><span>NNMI — Admission Open</span><span>01715-038551</span></div>
</body>
</html>
