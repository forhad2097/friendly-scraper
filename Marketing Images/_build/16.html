<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800;900&display=swap" />
<link rel="stylesheet" href="shared.css" />
<style>
  body { background: var(--forest); color: var(--forest-foreground); position:relative; }
  .center-wrap { height: 1000px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .logo-badge { width: 72px; height:72px; }
  .eyebrow { margin-top: 26px; font-family:"Poppins",sans-serif; font-weight:700; font-size:20px; letter-spacing:0.26em; text-transform:uppercase; color: var(--leaf); }
  .price { font-family:"Poppins",sans-serif; font-weight:900; font-size: 140px; line-height:1; margin-top: 14px; }
  .price-label { font-family:"Noto Sans Bengali",sans-serif; font-weight:700; font-size: 28px; margin-top: 6px; opacity:0.9; }

  .divider { width: 80px; height: 4px; background: var(--leaf); border-radius: 4px; margin: 34px 0; }

  .price2 { font-family:"Poppins",sans-serif; font-weight:800; font-size: 56px; }
  .price2-label { font-family:"Noto Sans Bengali",sans-serif; font-weight:600; font-size: 22px; margin-top:4px; opacity:0.85; }

  .note { margin-top: 34px; font-size: 20px; font-weight:600; background: oklch(0.97 0.02 145/0.1); padding: 16px 30px; border-radius: 999px; }

  .footer { position:absolute; bottom:0; left:0; right:0; background: var(--primary); color: var(--primary-foreground); padding: 26px 60px; display:flex; align-items:center; justify-content:space-between; font-family:"Poppins",sans-serif; font-weight:800; font-size:23px; }
</style>
</head>
<body>
  <div class="center-wrap">
    <img class="logo-badge" src="../_source/logo.png" />
    <div class="eyebrow">Admission Fee</div>
    <div class="price">৳50,000</div>
    <div class="price-label">এককালীন ভর্তি ফি</div>
    <div class="divider"></div>
    <div class="price2">৳2,500<span style="font-size:24px; font-weight:600;">/মাস</span></div>
    <div class="price2-label">হোস্টেল ফি</div>
    <div class="note">মাসিক বা ত্রৈমাসিক কিস্তিতে পরিশোধের সুবিধা</div>
  </div>
  <div class="footer"><span>Diploma in Nursing Science &amp; Midwifery · Diploma in Midwifery</span><span>01715-038551</span></div>
</body>
</html>
